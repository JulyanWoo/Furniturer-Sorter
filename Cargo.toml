[package]
name = "furniture-sorter"
version = "0.1.0"
edition = "2024"
description = "Offline Rust desktop utility for visual furniture photo grouping with deterministic fingerprinting and optional ONNX embeddings."
license = "MIT"

[[bin]]
name = "FurnitureSorter"
path = "src/main.rs"

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:ndarray"]

[dependencies]
anyhow = "1.0"
bincode = "1.3"
dirs = "6.0"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
image_hasher = "3.1"
kamadak-exif = "0.6"
ndarray = { version = "0.17", optional = true }
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "ndarray", "load-dynamic"] }
rayon = "1.10"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
